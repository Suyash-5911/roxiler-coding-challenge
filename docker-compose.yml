version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: store_rating_postgres
    restart: always
    environment:
      POSTGRES_DB: store_rating_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: store_rating_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      JWT_SECRET: roxiler_super_secret_jwt_key_2026
      DB_DIALECT: postgres
      DB_NAME: store_rating_db
      DB_USER: postgres
      DB_PASS: postgrespassword
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: store_rating_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
